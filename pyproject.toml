[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tfmedic"
version = "0.1.0"
description = "Autonomous terminal-native AI troubleshooting agent for AWS and Terraform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tfmedic maintainers" }]
keywords = ["aws", "terraform", "sre", "incident-response", "llm", "agent", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "openai>=1.40.0",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
  "boto3-stubs[ec2,rds,ssm,cloudwatch,sts]>=1.34.0",
]

[project.scripts]
tfmedic = "tfmedic.cli:run"

[project.urls]
Homepage = "https://github.com/your-org/tfmedic"
Issues = "https://github.com/your-org/tfmedic/issues"

[tool.hatch.build.targets.wheel]
packages = ["tfmedic"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "ARG"]
ignore = ["S101", "ARG002", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:tfmedic.*"]
